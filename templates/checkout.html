{% extends "base.html" %}
{% block content %}
<section class="page-shell checkout-page"><span class="eyebrow">GÜVENLİ ÖDEME</span><h1>Siparişi tamamla</h1>{% if error %}<div class="form-error">{{ error }}</div>{% endif %}<div class="checkout-layout"><form class="checkout-form" method="post" id="checkout-form"><h2>Teslimat bilgileri</h2><label>Ad soyad<input name="name" required autocomplete="name"></label><label>E-posta<input name="email" type="email" required autocomplete="email"></label><label>Adres<textarea name="address" required autocomplete="street-address"></textarea></label><div class="form-row"><label>Şehir<input name="city" required></label><label>Posta kodu<input name="postal" required inputmode="numeric"></label></div><h2>Ödeme</h2><div class="demo-notice">Eğitim modu: gerçek kart bilgisi alınmaz. Bu düğme yalnızca sahte sipariş oluşturur.</div><input type="hidden" name="cart" id="checkout-cart"><button class="checkout-button" type="submit">Demo siparişi tamamla</button></form><aside id="checkout-summary" class="summary-card">Sipariş özeti yükleniyor…</aside></div></section>
{% endblock %}
